<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Page</title>
  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      line-height: 1.6;
      color: #222;
      background: #fafafa;
    }
    header, footer {
      background: #2c3e50;
      color: #fff;
      padding: 1rem 2rem;
    }
    nav a {
      color: #fff;
      margin-right: 1rem;
      text-decoration: none;
    }
    nav a:hover {
      text-decoration: underline;
    }
    main {
      max-width: 800px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    button {
      padding: 0.5rem 1rem;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <h1>My Page</h1>
    <nav>
      <a href="#">Home</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <section>
      <h2>Welcome</h2>
      <p>This is a basic HTML page. Edit this file to add your own content.</p>
      <button id="greetBtn">Click me</button>
      <p id="message"></p>
    </section>

    <section id="about">
      <h2>About</h2>
      <p>Write something about yourself or your project here.</p>
    </section>

    <section id="contact">
      <h2>Contact</h2>
      <p>Email: you@example.com</p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 My Page</p>
  </footer>

  <script>
    document.getElementById("greetBtn").addEventListener("click", function () {
      document.getElementById("message").textContent = "Hello! Your page is working.";
    });
  </script>
</body>
</html>
